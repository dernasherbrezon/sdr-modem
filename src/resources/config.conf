# bind address for a server
# if empty, then sdr_modem is running in the cli mode
bind_address="127.0.0.1"

# port for a server
port=8091

# minimum level of log messages. Supported values are:
#   - "error"
#   - "warn"
#   - "info"
#   - "debug"
# default is "info"
# when running under systemd, levels are passed to journald:
#   journalctl -u sdr-modem -p err
log_level="info"

# buffer size for passing the data from SDR
# same buffer setting for passing data between threads
# the bigger buffer the less context switching, but
# bigger latency for RF messages
sdr_buffer_len=2048

# timeout for reading client's requests
# in seconds
# should be positive
read_timeout_seconds=10

# SDR backend. Supported values are:
#   - "plutosdr"
#   - "airspy" - rx only
#   - "file" - not supported in the server mode
sdr_type="file"

# plutosdr-specific settings
# gain. This passed as-is to "hardwaregain" parameter
# default is 0.0
plutosdr_hardwaregain=0.0
# timeout while communicating with the device
# default is 10 seconds (10000)
plutosdr_timeout_ms=10000
# libiio context uri, e.g. "ip:192.168.2.1" or "usb:1.2.5"
# if empty or missing, the first available context is used
#plutosdr_uri="ip:192.168.2.1"

# airspy-specific settings. requires libairspy to be installed
# gain mode. Supported values are:
#   - "auto" - LNA and mixer AGC are enabled. VGA is set to airspy_vga_gain
#   - "sensitivity" - airspy sensitivity gain table. "gain" parameter is used: 0..21
#   - "linearity" - airspy linearity gain table. "gain" parameter is used: 0..21
#   - "manual" - airspy_lna_gain, airspy_mixer_gain and airspy_vga_gain are used. "gain" parameter is ignored
# default is "auto"
airspy_gain_mode="auto"
# used in "manual" mode. 0..14. default is 0
#airspy_lna_gain=8
# used in "manual" mode. 0..15. default is 0
#airspy_mixer_gain=8
# used in "auto" and "manual" modes. 0..15. default is 0
#airspy_vga_gain=8
# enable bias-t. default is false
#airspy_bias_tee=false
# how long to wait for the next buffer from the device
# serial number of the device. decimal or hex. if empty or missing, the first available device is used
#airspy_serial="0x1234ABCD5678EF90"

# number of elements in the DSP queue
# the more queue, the better performance spikes handled
# the less queue, the better latency and memory consumption
# total memory = queue_size * sdr_buffer_len * number_of_clients
queue_size=64
