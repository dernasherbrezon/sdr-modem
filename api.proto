syntax = "proto3";

message gfsk_modem_settings {
    uint64 center_freq = 1;
    uint32 bandwidth = 2;
    uint64 sample_rate = 3;
    uint32 baud_rate = 4;
    int64 deviation = 5;
    float bt = 6;
    bool use_dc_block = 7;
}

message psk_modem_settings {
    uint64 center_freq = 1;
    uint32 bandwidth = 2;
    uint64 sample_rate = 3;
    uint32 baud_rate = 4;
    float rrc_beta = 5;
    uint32 rrc_delay = 6;
    float costas_bandwidth = 7;
    uint32 symsync_filter_bank_size = 8;
}

message psk_pm_modem_settings {
    uint64 center_freq = 1;
    uint32 baud_rate = 2;
    uint64 sample_rate = 3;

    uint32 subcarrier_frequency = 4;
    float carrier_pll_bandwidth = 5;
    uint32 subcarrier_bandwidth = 6;

    float rrc_beta = 7;
    uint32 rrc_delay = 8;
    float costas_bandwidth = 9;
    uint32 symsync_filter_bank_size = 10;

    float modulation_index = 11;
}

message none_framing {
}

message ModemRequest {
    oneof modem_settings {
        gfsk_modem_settings gfsk = 1;
        psk_modem_settings bpsk = 2;
        psk_modem_settings dpsk = 3;
        psk_modem_settings sdpsk = 4;
        psk_modem_settings oqpsk = 5;
        psk_pm_modem_settings psk_pm = 6;
    }
    oneof framing {
        none_framing none = 9;
    }
}

enum response_status {
    SUCCESS = 0;
    FAILURE = 1;
}

message Response {
    response_status status = 1;
    uint32 details = 2;
}

message TxData {
    bytes data = 1;
}